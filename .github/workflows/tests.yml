name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Z3 smoke checks
        run: python scripts/check_z3.py

      - name: Run tests
        # ABC-dependent tests are guarded by @pytest.mark.skipif and will
        # skip automatically when the ABC binary is not present.
        run: python -m pytest tests/ -v

      - name: Run lightweight joint region/interface discovery
        run: python scripts/run_joint_region_interface_discovery.py --mode controlled --max-real-seeds 0

      - name: Check joint region/interface result schemas
        run: python scripts/check_joint_region_interface_results.py --allow-no-abc

      - name: Run lightweight semantic functional refactoring
        run: python scripts/run_semantic_functional_refactoring.py --mode controlled

      - name: Check semantic functional refactoring result schemas
        run: python scripts/check_semantic_functional_refactoring_results.py --allow-no-abc

      - name: Run lightweight semantic recoverability frontier
        run: python scripts/run_semantic_recoverability_frontier.py --mode controlled

      - name: Check semantic recoverability frontier results
        run: python scripts/check_semantic_recoverability_results.py --allow-no-abc

      - name: Run lightweight active source-counterpart refactoring
        run: python scripts/run_active_source_counterpart_refactoring.py --mode controlled

      - name: Check active source-counterpart result schemas
        run: python scripts/check_active_source_counterpart_results.py --allow-no-abc

      - name: Run lightweight cross-netlist cut transplantation
        run: python scripts/run_cross_netlist_cut_transplantation.py --mode controlled

      - name: Check cross-netlist transplant result schemas
        run: python scripts/check_cross_netlist_transplant_results.py --allow-no-abc
